<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Score Mockup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f0ede8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .scene {
    position: relative;
    width: 1040px;
    height: 920px;
  }

  .photo-bg {
    position: absolute;
    inset: 0;
    border-radius: 24px;
    overflow: hidden;
    background: #c8bfb0;
  }

  .photo-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Floating chips */
  .chip {
    position: absolute;
    background: white;
    border-radius: 16px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.14);
    min-width: 210px;
  }

  .chip-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .chip-icon.pink   { background: #fce8ec; }
  .chip-icon.peach  { background: #fdeee6; }
  .chip-icon.purple { background: #ede8fd; }
  .chip-icon.green  { background: #e8f5ee; }

  .chip-label {
    font-size: 15px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.2;
  }

  .chip-status {
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 2px;
  }

  .chip-status::after {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
  }

  .good       { color: #1e9e5c; }
  .good::after { background: #1e9e5c; }
  .needs-work { color: #d97706; }
  .needs-work::after { background: #d97706; }

  /* Chip positions */
  .chip-photos    { top: 40px;  left: 55px; }
  .chip-reviews   { top: 420px; left: 40px; }
  .chip-title     { bottom: 140px; left: 165px; }
  .chip-amenities { bottom: 100px; right: 340px; }

  /* Score card */
  .score-card {
    position: absolute;
    top: 40px;
    right: 40px;
    width: 360px;
    background: white;
    border-radius: 20px;
    padding: 28px 28px 24px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.16);
  }

  .score-label {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #9ca3af;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .score-ring-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 12px;
  }

  .score-ring {
    position: relative;
    width: 120px;
    height: 120px;
  }

  .score-ring svg {
    transform: rotate(-90deg);
    width: 120px;
    height: 120px;
  }

  .score-ring-track {
    fill: none;
    stroke: #f0f0f0;
    stroke-width: 9;
  }

  .score-ring-fill {
    fill: none;
    stroke: hsl(35, 90%, 48%);
    stroke-width: 9;
    stroke-linecap: round;
    stroke-dasharray: 289;
    stroke-dashoffset: 81;
  }

  .score-number {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .score-number .big {
    font-size: 36px;
    font-weight: 800;
    color: #1a1a1a;
    line-height: 1;
  }

  .score-number .denom {
    font-size: 13px;
    color: #9ca3af;
    font-weight: 500;
    margin-top: 2px;
  }

  .score-verdict {
    text-align: center;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: #1e9e5c;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .score-divider {
    border: none;
    border-top: 1px solid #f0f0f0;
    margin-bottom: 16px;
  }

  .score-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 14px;
    color: #374151;
  }

  .score-row-left {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
  }

  .score-row-left .icon {
    font-size: 15px;
    color: #d63760;
    width: 18px;
    text-align: center;
  }

  .score-row-right {
    font-weight: 700;
    color: #9ca3af;
    font-size: 13px;
  }

  .score-row-right span {
    color: #1a1a1a;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="scene">

  <div class="photo-bg">
    <div style="width:100%;height:100%;background:linear-gradient(135deg,#b8ad9e 0%,#9e9080 100%);"></div>
  </div>

  <!-- Floating chips -->
  <div class="chip chip-photos">
    <div class="chip-icon pink">📷</div>
    <div>
      <div class="chip-label">Photos</div>
      <div class="chip-status good">Good</div>
    </div>
  </div>

  <div class="chip chip-reviews">
    <div class="chip-icon peach">⭐</div>
    <div>
      <div class="chip-label">Reviews &amp; Rating</div>
      <div class="chip-status needs-work">Needs Work</div>
    </div>
  </div>

  <div class="chip chip-title">
    <div class="chip-icon purple" style="font-size:18px;font-weight:900;color:#7c6fd0;">T</div>
    <div>
      <div class="chip-label">Title</div>
      <div class="chip-status needs-work">Needs Work</div>
    </div>
  </div>

  <div class="chip chip-amenities">
    <div class="chip-icon green">🏠</div>
    <div>
      <div class="chip-label">Amenities</div>
      <div class="chip-status good">Good</div>
    </div>
  </div>

  <!-- Score card -->
  <div class="score-card">
    <div class="score-label">Overall Score</div>

    <div class="score-ring-wrap">
      <div class="score-ring">
        <svg viewBox="0 0 120 120">
          <circle class="score-ring-track" cx="60" cy="60" r="46"/>
          <circle class="score-ring-fill"  cx="60" cy="60" r="46"/>
        </svg>
        <div class="score-number">
          <span class="big">72</span>
          <span class="denom">/100</span>
        </div>
      </div>
    </div>

    <div class="score-verdict">Good, Room to Grow</div>
    <hr class="score-divider">

    <div class="score-row">
      <div class="score-row-left"><span class="icon">📷</span> Photos</div>
      <div class="score-row-right"><span>78</span>/100</div>
    </div>
    <div class="score-row">
      <div class="score-row-left"><span class="icon">⭐</span> Reviews &amp; Rating</div>
      <div class="score-row-right"><span>62</span>/100</div>
    </div>
    <div class="score-row">
      <div class="score-row-left"><span class="icon" style="font-weight:900;color:#d63760;">T</span> Title</div>
      <div class="score-row-right"><span>58</span>/100</div>
    </div>
    <div class="score-row">
      <div class="score-row-left"><span class="icon">🏠</span> Amenities</div>
      <div class="score-row-right"><span>71</span>/100</div>
    </div>
    <div class="score-row">
      <div class="score-row-left"><span class="icon">📝</span> Overview</div>
      <div class="score-row-right"><span>65</span>/100</div>
    </div>
    <div class="score-row">
      <div class="score-row-left"><span class="icon">📄</span> Description</div>
      <div class="score-row-right"><span>70</span>/100</div>
    </div>
    <div class="score-row">
      <div class="score-row-left"><span class="icon">⚡</span> Conversion Signals</div>
      <div class="score-row-right"><span>55</span>/100</div>
    </div>
  </div>

</div>

</body>
</html>
